<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Loyalty Cards</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="cards-page">
    <div class="cards-container">
        <div class="cards-header">
            <h1>Loyalty Cards</h1>
            <p class="cards-subtitle">Tap a card to display barcode or QR code.</p>
        </div>

        <div class="cards-search-box">
            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="cardSearchInput" placeholder="Search cards..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
            <button id="clearSearchBtn" class="clear-search-btn hidden" aria-label="Clear search">&times;</button>
        </div>

        <div id="cardsList" class="cards-list">
            <!-- Cards list generated via js/cards.js -->
        </div>

        <div id="emptyState" class="cards-empty hidden">
            No matching loyalty cards found.
        </div>
    </div>

    <!-- Modal for displaying barcode/QR code -->
    <div id="cardModal" class="card-modal hidden">
        <div id="modalBackdrop" class="card-modal-backdrop"></div>
        <div class="card-modal-content">
            <button id="modalCloseBtn" class="modal-close-btn" aria-label="Close modal">&times;</button>
            <div class="modal-header">
                <h2 id="modalTitle">Card Name</h2>
            </div>
            <div class="code-display-area">
                <canvas id="barcodeCanvas"></canvas>
                <div id="qrcodeContainer" class="qrcode-container"></div>
            </div>
            <div class="modal-footer">
                <div id="modalValue" class="modal-value-text">0000000000</div>
            </div>
        </div>
    </div>

    <!-- Barcode & QR Code rendering libraries -->
    <script src="js/JsBarcode.all.min.js"></script>
    <script src="js/qrcode.min.js"></script>
    <script src="js/cards.js"></script>
</body>

</html>
